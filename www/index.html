<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>बाबा संवाद — Enterprise Senior OS</title>
  <style>
    :root {
      --bg: #050811;
      --surface: #0E1626;
      --surface-elevated: #162238;
      --border: #1E2D4A;
      --text-main: #FFFFFF;
      --text-muted: #8AA2C0;
      --accent-family: #10B981;
      --accent-daily: #0EA5E9;
      --accent-health: #F43F5E;
      --accent-outing: #F59E0B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top, 16px) 16px 48px;
    }

    /* Master Top HUD */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-controls { display: flex; gap: 10px; }
    .hud-btn {
      background: #172554;
      color: #93C5FD;
      border: 1px solid #2563EB;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .hud-btn.active { background: #2563EB; color: #FFF; }
    .hud-sos {
      background: #991B1B;
      color: #FFF;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(153,27,27,0.5);
      cursor: pointer;
    }
    .hud-sos:active { transform: scale(0.96); }

    /* Immersive Speech Display Banner */
    .speech-banner {
      background: linear-gradient(135deg, #0C1E3E, #050E20);
      border: 2px solid #2563EB;
      border-radius: 24px;
      padding: 22px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(37,99,235,0.25);
    }
    .banner-text-lg { font-size: 2.1rem; font-weight: 900; color: #FFFFFF; line-height: 1.15; }
    .banner-text-sm { font-size: 1.05rem; color: #93C5FD; margin-top: 6px; font-weight: 700; }
    .btn-repeat {
      background: #2563EB;
      color: #FFF;
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 1.15rem;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
      cursor: pointer;
    }
    .btn-repeat:active { transform: scale(0.96); }

    /* Primary Binary Row (YES / NO) */
    .binary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .binary-btn {
      padding: 22px;
      border-radius: 20px;
      font-size: 2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: none;
      color: #FFF;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
    }
    .binary-btn:active { transform: scale(0.97); }
    .b-yes { background: #065F46; border: 2px solid #10B981; }
    .b-no  { background: #991B1B; border: 2px solid #EF4444; }

    /* Category Filter Navigation */
    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 16px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-chip {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 12px 22px;
      border-radius: 99px;
      font-size: 1.05rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-chip.active {
      background: #FFFFFF;
      color: #050811;
      border-color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(255,255,255,0.2);
    }

    /* Touch Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 650px) {
      .grid-container { grid-template-columns: repeat(3, 1fr); }
    }
    .card-tile {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 2px solid var(--border);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .card-tile:active { transform: scale(0.96); }
    .card-tile.active-speaking {
      background: var(--surface-elevated);
      border-color: #38BDF8;
      box-shadow: 0 0 30px rgba(56,189,248,0.3);
    }
    .card-tile.family { border-top: 5px solid var(--accent-family); }
    .card-tile.daily  { border-top: 5px solid var(--accent-daily); }
    .card-tile.health { border-top: 5px solid var(--accent-health); }
    .card-tile.outing { border-top: 5px solid var(--accent-outing); }

    .avatar-ring {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: #050811;
      border: 3px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
    }
    .avatar-ring img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 1.55rem; font-weight: 900; color: #FFFFFF; line-height: 1.25; }
    .card-subtitle { font-size: 0.95rem; color: var(--text-muted); margin-top: 4px; font-weight: 700; }

    .edit-panel {
      margin-top: 14px;
      width: 100%;
    }
    .btn-photo-upload {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px dashed #475569;
      background: #0B132B;
      color: #CBD5E1;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-photo-upload.has-image {
      background: #064E3B;
      border-color: #10B981;
      color: #A7F3D0;
      border-style: solid;
    }
  </style>
</head>
<body>

<div class="hud">
  <div class="brand-title">🗣️ बाबा संवाद <span style="font-size:0.65rem; background:#0369A1; color:#fff; padding:3px 8px; border-radius:6px; letter-spacing:0.5px;">PRO ARCHITECT</span></div>
  <div class="hud-controls">
    <button class="hud-btn" id="editToggleBtn" onclick="toggleEdit()">🔒 संपादन</button>
    <button class="hud-sos" onclick="triggerEmergency()">🔔 मदत</button>
  </div>
</div>

<div class="speech-banner">
  <div>
    <div class="banner-text-lg" id="bannerTitle">कोणत्याही कार्डवर टॅप करा</div>
    <div class="banner-text-sm" id="bannerSub">Deep Male Neural Voice Active</div>
  </div>
  <button class="btn-repeat" onclick="repeatCurrent()">🔊 पुन्हा</button>
</div>

<div class="binary-row">
  <button class="binary-btn b-yes" onclick="speakPhrase({id:'yes', mr:'हो, बरोबर आहे', sub:'Yes, correct', speak:'हो, बरोबर आहे', phonetic:'Hoo... Ho, barobar aahe. Yes.'})">✅ हो (YES)</button>
  <button class="binary-btn b-no" onclick="speakPhrase({id:'no', mr:'नाही, मला नको', sub:'No, I do not want', speak:'नाही, मला नको', phonetic:'Naa-hee... Naahi, mala nako. No.'})">❌ नाही (NO)</button>
</div>

<div class="categories" id="categoryNav"></div>
<div class="grid-container" id="tileGrid"></div>

<input type="file" id="hiddenFileInput" accept="image/*" style="display:none" />

<script>
  const STORAGE_KEY = 'baba_architect_v3';
  let editModeActive = false;
  let activeCategory = 'all';
  let targetPhotoId = null;
  let lastSpokenItem = { mr:'हो, बरोबर आहे', phonetic:'Hoo... Ho, barobar aahe. Yes.', speak:'हो, बरोबर आहे' };

  const CATEGORIES = [
    { id: 'all', label: '🌟 सर्व (All)' },
    { id: 'family', label: '👨‍👩‍👧‍👦 कुटुंब (Family)' },
    { id: 'daily', label: '💧 दैनंदिन (Daily)' },
    { id: 'health', label: '💊 तब्येत (Health)' },
    { id: 'outing', label: '🚗 बाहेर / गावी (Outings)' }
  ];

  const CARDS = [
    // Family
    { id: 'sushma', cat: 'family', icon: '👩', mr: 'सुषमा', sub: 'Sushma (Wife)', speak: 'सुषमा, इकडे ये', phonetic: 'Sushma... Sushma ikade ye' },
    { id: 'abhijeet', cat: 'family', icon: '👨', mr: 'अभिजीत', sub: 'Abhijeet (Son)', speak: 'अभिजीतला बोलवा', phonetic: 'Abhijeet... Abhijeet la bolva' },
    { id: 'sonali', cat: 'family', icon: '👩', mr: 'सोनाली (ताई)', sub: 'Sonali (Sister)', speak: 'सोनाली ताईला बोलवा', phonetic: 'Sonali... Sonali tai la bolva' },
    { id: 'ira', cat: 'family', icon: '👧', mr: 'इरा', sub: 'Ira (Granddaughter)', speak: 'इराला इकडे बोलवा', phonetic: 'Era... Era la ikade bolva' },
    { id: 'swapnali', cat: 'family', icon: '👩', mr: 'स्वप्नाली', sub: 'Swapnali (Daughter-in-law)', speak: 'स्वप्नाली, इकडे ये', phonetic: 'Swapnali... Swapnali ikade ye' },

    // Daily
    { id: 'water', cat: 'daily', icon: '💧', mr: 'पिण्याचे पाणी', sub: 'Drinking Water', speak: 'मला पिण्यासाठी पाणी द्या', phonetic: 'Paani... Mala pinyasathi paani dya' },
    { id: 'tablets', cat: 'daily', icon: '💊', mr: 'गोळ्या / औषधे', sub: 'Tablets / Medicine', speak: 'माझ्या गोळ्या आणि औषधे द्या', phonetic: 'Golya... Majhya golya aani aushadhe dya' },
    { id: 'food', cat: 'daily', icon: '🍛', mr: 'जेवण / भूक', sub: 'Food / Hungry', speak: 'मला भूक लागली आहे, जेवण द्या', phonetic: 'Jevan... Mala bhook lagli aahe, jevan dya' },
    { id: 'tea', cat: 'daily', icon: '☕', mr: 'गरम चहा', sub: 'Hot Tea', speak: 'मला गरम चहा हवा आहे', phonetic: 'Chaha... Mala garam chaha hava aahe' },
    { id: 'bathroom', cat: 'daily', icon: '🚻', mr: 'बाथरूम', sub: 'Washroom', speak: 'मला बाथरूमला जायचे आहे', phonetic: 'Bathroom... Mala bathroom la jayche aahe' },
    { id: 'glasses', cat: 'daily', icon: '👓', mr: 'माझा चष्मा', sub: 'My Glasses', speak: 'माझा चष्मा द्या', phonetic: 'Chashma... Majha chashma dya' },

    // Health
    { id: 'toothache', cat: 'health', icon: '🦷', mr: 'दाढ दुखत आहे', sub: 'Toothache', speak: 'माझी दाढ खूप दुखत आहे', phonetic: 'Dadh dukhte... Majhi dadh khoop dukhat aahe' },
    { id: 'stomach', cat: 'health', icon: '🤢', mr: 'पोट बिघडले', sub: 'Stomach Upset', speak: 'माझे पोट बिघडले आहे', phonetic: 'Pot bighadle... Majhe pot bighadle aahe' },
    { id: 'doctor', cat: 'health', icon: '🩺', mr: 'डॉक्टरांकडे चला', sub: 'Visit Doctor', speak: 'मला डॉक्टरांकडे घेऊन चला', phonetic: 'Doctor... Mala doctoran kade gheun chala' },
    { id: 'bodypain', cat: 'health', icon: '🤕', mr: 'हात-पाय दुखणे', sub: 'Body Pain', speak: 'माझे हात पाय दुखत आहेत', phonetic: 'Haat paay dukhtat... Majhe haat paay dukhat aahet' },

    // Outings
    { id: 'walk', cat: 'outing', icon: '🚶‍♂️', mr: 'फिरायला जायचे', sub: 'Go for Walk', speak: 'मला बाहेर फिरायला जायचे आहे', phonetic: 'Firayla jaane... Mala baher firayla jayche aahe' },
    { id: 'village', cat: 'outing', icon: '🏡', mr: 'गावी जायचे', sub: 'Go to Village', speak: 'मला गावी जायचे आहे', phonetic: 'Gavi jaane... Mala gavi jayche aahe' }
  ];

  let appState = { photos: {} };
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) appState = JSON.parse(saved);
  } catch (e) {}

  function persistState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
  }

  function toggleEdit() {
    editModeActive = !editModeActive;
    const btn = document.getElementById('editToggleBtn');
    btn.textContent = editModeActive ? '🔓 संपादन: चालू' : '🔒 संपादन';
    btn.className = editModeActive ? 'hud-btn active' : 'hud-btn';
    renderGrid();
  }

  // Enterprise Deep Male Voice Engine with Syllable Priming
  async function speakPhrase(item) {
    lastSpokenItem = item;
    document.getElementById('bannerTitle').textContent = item.mr;
    document.getElementById('bannerSub').textContent = item.phonetic;

    // Visual feedback highlight
    document.querySelectorAll('.card-tile').forEach(el => el.classList.remove('active-speaking'));
    const activeEl = document.getElementById(`card-${item.id}`);
    if (activeEl) activeEl.classList.add('active-speaking');

    // 1. Native Android Hardware TTS (Inside compiled APK)
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) {
      try {
        await window.Capacitor.Plugins.TextToSpeech.speak({
          text: item.speak,
          lang: 'mr-IN',
          rate: 0.80,
          pitch: 0.65, // Deep resonant bass male
          volume: 1.0
        });
        return;
      } catch (err) {
        try {
          await window.Capacitor.Plugins.TextToSpeech.speak({
            text: item.phonetic,
            lang: 'en-IN',
            rate: 0.80,
            pitch: 0.65,
            volume: 1.0
          });
          return;
        } catch (e2) {}
      }
    }

    // 2. Browser Fallback with Strict Male Filtering
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => {
        const voices = window.speechSynthesis.getVoices() || [];
        const femaleFilter = /female|swara|heera|zira|samantha|veena|lekha|kalpana|aria|jenny/i;
        const maleFilter = /male|rishi|prabhat|madhur|hemant|david|mark|daniel|george|alex|guy|ravi/i;

        const cleanVoices = voices.filter(v => !femaleFilter.test(v.name));
        const selectedVoice = cleanVoices.find(v => (/mr|hi|en-IN/i.test(v.lang)) && maleFilter.test(v.name)) ||
                              cleanVoices.find(v => maleFilter.test(v.name)) ||
                              cleanVoices.find(v => /IN/i.test(v.lang)) ||
                              cleanVoices[0];

        const utterance = new SpeechSynthesisUtterance(item.phonetic);
        window.__activeUtterance = utterance;

        if (selectedVoice) {
          utterance.voice = selectedVoice;
          utterance.lang = selectedVoice.lang;
        } else {
          utterance.lang = 'en-IN';
        }

        utterance.pitch = 0.65; // Deep male bass
        utterance.rate = 0.80;
        utterance.volume = 1.0;

        window.speechSynthesis.speak(utterance);
      }, 40);
    }
  }

  function repeatCurrent() { speakPhrase(lastSpokenItem); }

  function triggerEmergency() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime;
      [440, 659.25, 440, 659.25].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t + idx * 0.15);
        gain.gain.setValueAtTime(0.5, t + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.15 + 0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t + idx * 0.15); osc.stop(t + idx * 0.15 + 0.38);
      });
    } catch (e) {}

    speakPhrase({
      id: 'sos',
      mr: 'कृपया इकडे या!',
      sub: 'Emergency Attention',
      speak: 'कृपया इकडे या, मला मदत हवी आहे',
      phonetic: 'Krupaya ikade yaa... Mala madat havi aahe'
    });
  }

  function triggerPhotoSelect(e, cardId) {
    e.stopPropagation();
    targetPhotoId = cardId;
    const fileInput = document.getElementById('hiddenFileInput');
    fileInput.value = '';
    fileInput.click();
  }

  document.getElementById('hiddenFileInput').addEventListener('change', function(evt) {
    const file = evt.target.files && evt.target.files[0];
    if (!file || !targetPhotoId) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 200; canvas.height = 200;
        const side = Math.min(img.width, img.height);
        canvas.getContext('2d').drawImage(img, (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, 200, 200);
        appState.photos[targetPhotoId] = canvas.toDataURL('image/jpeg', 0.82);
        persistState();
        renderGrid();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  function renderCategories() {
    document.getElementById('categoryNav').innerHTML = CATEGORIES.map(cat =>
      `<button class="cat-chip ${activeCategory === cat.id ? 'active' : ''}" onclick="activeCategory='${cat.id}'; renderCategories(); renderGrid();">${cat.label}</button>`
    ).join('');
  }

  function renderGrid() {
    const list = activeCategory === 'all' ? CARDS : CARDS.filter(c => c.cat === activeCategory);
    document.getElementById('tileGrid').innerHTML = list.map(c => {
      const pic = appState.photos && appState.photos[c.id];
      return `
        <div class="card-tile ${c.cat}" id="card-${c.id}" onclick='speakPhrase(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
          <div class="avatar-ring">${pic ? `<img src="${pic}" />` : c.icon}</div>
          <div class="card-title">${c.mr}</div>
          <div class="card-subtitle">${c.sub}
