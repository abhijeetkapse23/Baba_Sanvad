<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>बाबा संवाद — Senior OS</title>
  <style>
    :root {
      --bg: #030712;
      --surface: #0F172A;
      --surface-card: #1E293B;
      --border: #334155;
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --accent-family: #10B981;
      --accent-daily: #0EA5E9;
      --accent-health: #F43F5E;
      --accent-outing: #F59E0B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top, 12px) 12px 40px;
    }

    /* Clean Streamlined HUD */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 900;
      color: #38BDF8;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand span { font-size: 0.6rem; color: #64748B; letter-spacing: 0.5px; }
    .hud-right { display: flex; gap: 8px; align-items: center; }
    .btn-action {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-action.active { background: #0284C7; border-color: #38BDF8; color: #FFF; }
    .btn-emergency {
      background: #DC2626;
      color: #FFF;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.85rem;
      box-shadow: 0 3px 10px rgba(220,38,38,0.4);
      cursor: pointer;
    }
    .btn-emergency:active { transform: scale(0.96); }

    /* Immersive Speech Banner */
    .speech-banner {
      background: linear-gradient(135deg, #0C1E3E, #090D16);
      border: 2px solid #2563EB;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(37,99,235,0.2);
    }
    .banner-main { font-size: 1.65rem; font-weight: 900; color: #FFF; line-height: 1.2; }
    .banner-sub { font-size: 0.85rem; color: #93C5FD; margin-top: 3px; font-weight: 700; }
    .btn-speak-again {
      background: #2563EB;
      color: #FFF;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    }
    .btn-speak-again:active { transform: scale(0.96); }

    /* Binary Row (YES / NO) */
    .binary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .bin-btn {
      padding: 16px;
      border-radius: 16px;
      font-size: 1.5rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      color: #FFF;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .bin-btn:active { transform: scale(0.97); }
    .b-yes { background: #065F46; border: 2px solid #10B981; }
    .b-no  { background: #991B1B; border: 2px solid #EF4444; }

    /* Category Nav */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 6px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.95rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-pill.active {
      background: #FFF;
      color: #030712;
      border-color: #FFF;
      box-shadow: 0 4px 12px rgba(255,255,255,0.15);
    }

    /* Card Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 600px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .card-item {
      background: var(--surface-card);
      border-radius: 20px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 2px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .card-item:active { transform: scale(0.96); }
    .card-item.active-speaking {
      background: #1E3A8A;
      border-color: #38BDF8;
      box-shadow: 0 0 25px rgba(56,189,248,0.3);
    }
    .card-item.family { border-top: 5px solid var(--accent-family); }
    .card-item.daily  { border-top: 5px solid var(--accent-daily); }
    .card-item.health { border-top: 5px solid var(--accent-health); }
    .card-item.outing { border-top: 5px solid var(--accent-outing); }

    .card-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #030712;
      border: 3px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 1.3rem; font-weight: 900; color: #FFF; line-height: 1.2; }
    .card-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 3px; font-weight: 700; }

    .edit-area {
      margin-top: 10px;
      width: 100%;
    }
    .btn-upload {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #64748B;
      background: #0B0F19;
      color: #CBD5E1;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-upload.has-img {
      background: #064E3B;
      border-color: #10B981;
      color: #A7F3D0;
      border-style: solid;
    }
  </style>
</head>
<body>

<div class="hud">
  <div class="brand">
    🗣️ बाबा संवाद
    <span>SENIOR OS PRO</span>
  </div>
  <div class="hud-right">
    <button class="btn-action" id="editToggleBtn" onclick="toggleEdit()">🔒 संपादन</button>
    <button class="btn-emergency" onclick="triggerSOS()">🔔 मदत</button>
  </div>
</div>

<div class="speech-banner">
  <div>
    <div class="banner-main" id="bannerTitle">कोणत्याही कार्डवर टॅप करा</div>
    <div class="banner-sub" id="bannerSub">Deep Male Voice Engine Ready</div>
  </div>
  <button class="btn-speak-again" onclick="repeatLast()">🔊 पुन्हा</button>
</div>

<div class="binary-grid">
  <button class="bin-btn b-yes" onclick="speakPhrase({id:'yes', mr:'हो, बरोबर आहे', sub:'Yes, correct', speak:'हो, बरोबर आहे', phonetic:'Hoo... Ho, barobar aahe. Yes.'})">✅ हो (YES)</button>
  <button class="bin-btn b-no" onclick="speakPhrase({id:'no', mr:'नाही, मला नको', sub:'No, I do not want', speak:'नाही, मला नको', phonetic:'Naa-hee... Naahi, mala nako. No.'})">❌ नाही (NO)</button>
</div>

<div class="category-scroll" id="catScroll"></div>
<div class="cards-grid" id="cardsGrid"></div>

<input type="file" id="fileSelector" accept="image/*" style="display:none" />

<script>
  const STORAGE_KEY = 'baba_senior_os_v4';
  let editingEnabled = false;
  let activeTab = 'all';
  let activeCardId = null;
  let lastItem = { mr:'हो, बरोबर आहे', phonetic:'Hoo... Ho, barobar aahe. Yes.', speak:'हो, बरोबर आहे' };

  const CATEGORIES = [
    { id: 'all', label: '🌟 सर्व (All)' },
    { id: 'family', label: '👨‍👩‍👧‍👦 कुटुंब (Family)' },
    { id: 'daily', label: '💧 दैनंदिन (Daily)' },
    { id: 'health', label: '💊 तब्येत (Health)' },
    { id: 'outing', label: '🚗 बाहेर / गावी (Outings)' }
  ];

  const CARDS = [
    { id: 'sushma', cat: 'family', icon: '👩', mr: 'सुषमा', sub: 'Sushma (Wife)', speak: 'सुषमा, इकडे ये', phonetic: 'Sushma... Sushma ikade ye' },
    { id: 'abhijeet', cat: 'family', icon: '👨', mr: 'अभिजीत', sub: 'Abhijeet (Son)', speak: 'अभिजीतला बोलवा', phonetic: 'Abhijeet... Abhijeet la bolva' },
    { id: 'sonali', cat: 'family', icon: '👩', mr: 'सोनाली (ताई)', sub: 'Sonali (Sister)', speak: 'सोनाली ताईला बोलवा', phonetic: 'Sonali... Sonali tai la bolva' },
    { id: 'ira', cat: 'family', icon: '👧', mr: 'इरा', sub: 'Ira (Granddaughter)', speak: 'इराला इकडे बोलवा', phonetic: 'Era... Era la ikade bolva' },
    { id: 'swapnali', cat: 'family', icon: '👩', mr: 'स्वप्नाली', sub: 'Swapnali (Daughter-in-law)', speak: 'स्वप्नाली, इकडे ये', phonetic: 'Swapnali... Swapnali ikade ye' },

    { id: 'water', cat: 'daily', icon: '💧', mr: 'पिण्याचे पाणी', sub: 'Drinking Water', speak: 'मला पिण्यासाठी पाणी द्या', phonetic: 'Paani... Mala pinyasathi paani dya' },
    { id: 'tablets', cat: 'daily', icon: '💊', mr: 'गोळ्या / औषधे', sub: 'Tablets / Medicine', speak: 'माझ्या गोळ्या आणि औषधे द्या', phonetic: 'Golya... Majhya golya aani aushadhe dya' },
    { id: 'food', cat: 'daily', icon: '🍛', mr: 'जेवण / भूक', sub: 'Food / Hungry', speak: 'मला भूक लागली आहे, जेवण द्या', phonetic: 'Jevan... Mala bhook lagli aahe, jevan dya' },
    { id: 'tea', cat: 'daily', icon: '☕', mr: 'गरम चहा', sub: 'Hot Tea', speak: 'मला गरम चहा हवा आहे', phonetic: 'Chaha... Mala garam chaha hava aahe' },
    { id: 'bathroom', cat: 'daily', icon: '🚻', mr: 'बाथरूम', sub: 'Washroom', speak: 'मला बाथरूमला जायचे आहे', phonetic: 'Bathroom... Mala bathroom la jayche aahe' },
    { id: 'glasses', cat: 'daily', icon: '👓', mr: 'माझा चष्मा', sub: 'My Glasses', speak: 'माझा चष्मा द्या', phonetic: 'Chashma... Majha chashma dya' },

    { id: 'toothache', cat: 'health', icon: '🦷', mr: 'दाढ दुखत आहे', sub: 'Toothache', speak: 'माझी दाढ खूप दुखत आहे', phonetic: 'Dadh dukhte... Majhi dadh khoop dukhat aahe' },
    { id: 'stomach', cat: 'health', icon: '🤢', mr: 'पोट बिघडले', sub: 'Stomach Upset', speak: 'माझे पोट बिघडले आहे', phonetic: 'Pot bighadle... Majhe pot bighadle aahe' },
    { id: 'doctor', cat: 'health', icon: '🩺', mr: 'डॉक्टरांकडे चला', sub: 'Visit Doctor', speak: 'मला डॉक्टरांकडे घेऊन चला', phonetic: 'Doctor... Mala doctoran kade gheun chala' },
    { id: 'bodypain', cat: 'health', icon: '🤕', mr: 'हात-पाय दुखणे', sub: 'Body Pain', speak: 'माझे हात पाय दुखत आहेत', phonetic: 'Haat paay dukhtat... Majhe haat paay dukhat aahet' },

    { id: 'walk', cat: 'outing', icon: '🚶‍♂️', mr: 'फिरायला जायचे', sub: 'Go for Walk', speak: 'मला बाहेर फिरायला जायचे आहे', phonetic: 'Firayla jaane... Mala baher firayla jayche aahe' },
    { id: 'village', cat: 'outing', icon: '🏡', mr: 'गावी जायचे', sub: 'Go to Village', speak: 'मला गावी जायचे आहे', phonetic: 'Gavi jaane... Mala gavi jayche aahe' }
  ];

  let appData = { photos: {} };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) appData = JSON.parse(raw);
  } catch (e) {}

  function saveAppData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch (e) {}
  }

  function toggleEdit() {
    editingEnabled = !editingEnabled;
    const btn = document.getElementById('editToggleBtn');
    btn.textContent = editingEnabled ? '🔓 संपादन: चालू' : '🔒 संपादन';
    btn.className = editingEnabled ? 'btn-action active' : 'btn-action';
    renderGrid();
  }

  async function speakPhrase(item) {
    lastItem = item;
    document.getElementById('bannerTitle').textContent = item.mr;
    document.getElementById('bannerSub').textContent = item.phonetic;

    document.querySelectorAll('.card-item').forEach(el => el.classList.remove('active-speaking'));
    const targetEl = document.getElementById(`card-${item.id}`);
    if (targetEl) targetEl.classList.add('active-speaking');

    // 1. Native Android TTS inside APK
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) {
      try {
        await window.Capacitor.Plugins.TextToSpeech.speak({
          text: item.speak,
          lang: 'mr-IN',
          rate: 0.80,
          pitch: 0.65,
          volume: 1.0
        });
        return;
      } catch (err) {
        try {
          await window.Capacitor.Plugins.TextToSpeech.speak({
            text: item.phonetic,
            lang: 'en-IN',
            rate: 0.80,
            pitch: 0.65,
            volume: 1.0
          });
          return;
        } catch (e2) {}
      }
    }

    // 2. Browser Web Speech fallback with Male Filtering
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => {
        const voices = window.speechSynthesis.getVoices() || [];
        const noFemale = voices.filter(v => !/female|swara|heera|zira|samantha|veena|lekha/i.test(v.name));
        const maleVoice = noFemale.find(v => /mr|hi|en-IN/i.test(v.lang) && /male|rishi|prabhat|madhur|hemant|david|mark|guy/i.test(v.name)) ||
                          noFemale.find(v => /male|rishi|prabhat|madhur|hemant|david|mark|guy/i.test(v.name)) ||
                          noFemale.find(v => /IN/i.test(v.lang)) || noFemale[0];

        const utterance = new SpeechSynthesisUtterance(item.phonetic);
        window.__uttRef = utterance;
        if (maleVoice) {
          utterance.voice = maleVoice;
          utterance.lang = maleVoice.lang;
        } else {
          utterance.lang = 'en-IN';
        }
        utterance.pitch = 0.65;
        utterance.rate = 0.80;
        utterance.volume = 1.0;

        window.speechSynthesis.speak(utterance);
      }, 30);
    }
  }

  function repeatLast() { speakPhrase(lastItem); }

  function triggerSOS() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [440, 659.25, 440, 659.25].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.15);
        g.gain.setValueAtTime(0.4, now + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.35);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.38);
      });
    } catch (e) {}

    speakPhrase({
      id: 'sos',
      mr: 'कृपया इकडे या!',
      sub: 'Emergency Help',
      speak: 'कृपया इकडे या, मला मदत हवी आहे',
      phonetic: 'Krupaya ikade yaa... Mala madat havi aahe'
    });
  }

  function selectPhoto(e, id) {
    e.stopPropagation();
    activeCardId = id;
    const picker = document.getElementById('fileSelector');
    picker.value = '';
    picker.click();
  }

  document.getElementById('fileSelector').addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file || !activeCardId) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 180; canvas.height = 180;
        const side = Math.min(img.width, img.height);
        canvas.getContext('2d').drawImage(img, (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, 180, 180);
        appData.photos[activeCardId] = canvas.toDataURL('image/jpeg', 0.8);
        saveAppData();
        renderGrid();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function renderCategories() {
    document.getElementById('catScroll').innerHTML = CATEGORIES.map(cat =>
      `<button class="cat-pill ${activeTab === cat.id ? 'active' : ''}" onclick="activeTab='${cat.id}'; renderCategories(); renderGrid();">${cat.label}</button>`
    ).join('');
  }

  function renderGrid() {
    const list = activeTab === 'all' ? CARDS : CARDS.filter(c => c.cat === activeTab);
    document.getElementById('cardsGrid').innerHTML = list.map(c => {
      const img = appData.photos && appData.photos[c.id];
      return `
        <div class="card-item ${c.cat}" id="card-${c.id}" onclick='speakPhrase(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
          <div class="card-avatar">${img ? `<img src="${img}" />` : c.icon}</div>
          <div class="card-title">${c.mr}</div>
          <div class="card-sub">${c.sub}</div>
          ${editingEnabled ? `
            <div class="edit-area">
              <button class="btn-upload ${img ? 'has-img' : ''}" onclick="selectPhoto(event, '${c.id}')">📷 फोटो बदलावा ${img ? '✓' : ''}</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  renderCategories();
  renderGrid();
</script>
</body>
</html>
