<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>बाबा संवाद — Senior OS Architect Edition</title>
  <style>
    :root {
      --canvas-bg: #07090E;
      --card-bg: #131A29;
      --card-pressed: #1A243A;
      --border-subtle: #222E48;
      --text-main: #FFFFFF;
      --text-muted: #8B9BB4;
      
      /* Editorial Semantic Palette */
      --tone-family: #0D9488;
      --tone-daily: #0284C7;
      --tone-health: #E11D48;
      --tone-outing: #D97706;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    body {
      margin: 0;
      background: var(--canvas-bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: env(safe-area-inset-top, 16px) 16px 48px;
    }

    /* Master Architectural Navigation HUD */
    .master-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .brand-group {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #F8FAFC;
    }
    .brand-subtitle {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 2px;
    }
    .hud-actions { display: flex; gap: 10px; align-items: center; }
    .btn-architect {
      background: #1E293B;
      color: #CBD5E1;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-architect.active { background: #0284C7; border-color: #38BDF8; color: #FFF; }
    .btn-sos-tactile {
      background: #991B1B;
      color: #FFF;
      border: none;
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 4px 14px rgba(153,27,27,0.4);
      cursor: pointer;
    }
    .btn-sos-tactile:active { transform: scale(0.96); }

    /* Immersive Acoustic Stage Banner */
    .acoustic-stage {
      background: linear-gradient(145deg, #101A2E, #090E1A);
      border: 1px solid #1E3A8A;
      border-radius: 24px;
      padding: 22px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .stage-text-lg { font-size: 1.95rem; font-weight: 800; color: #FFFFFF; line-height: 1.2; letter-spacing: -0.5px; }
    .stage-text-sm { font-size: 0.9rem; color: #60A5FA; margin-top: 6px; font-weight: 600; }
    .btn-replay {
      background: #2563EB;
      color: #FFF;
      border: none;
      border-radius: 16px;
      padding: 16px 22px;
      font-size: 1rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37,99,235,0.35);
    }
    .btn-replay:active { transform: scale(0.96); }

    /* Binary Row (YES / NO) */
    .binary-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .binary-tile {
      padding: 20px;
      border-radius: 20px;
      font-size: 1.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: none;
      color: #FFF;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
    }
    .binary-tile:active { transform: scale(0.97); }
    .tile-yes { background: #065F46; border: 1px solid #10B981; }
    .tile-no  { background: #7F1D1D; border: 1px solid #EF4444; }

    /* Minimalist Category Scroller */
    .category-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 16px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .category-scroller::-webkit-scrollbar { display: none; }
    .category-chip {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 12px 22px;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .category-chip.active {
      background: #F8FAFC;
      color: #07090E;
      border-color: #F8FAFC;
      box-shadow: 0 4px 16px rgba(255,255,255,0.15);
    }

    /* Asymmetric Tactile Card Grid */
    .tactile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 650px) {
      .tactile-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .tactile-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .tactile-card:active { transform: scale(0.96); background: var(--card-pressed); }
    .tactile-card.is-active-speech {
      background: #172554;
      border-color: #38BDF8;
      box-shadow: 0 0 35px rgba(56,189,248,0.25);
    }
    
    .tactile-card.family { border-top: 4px solid var(--tone-family); }
    .tactile-card.daily  { border-top: 4px solid var(--tone-daily); }
    .tactile-card.health { border-top: 4px solid var(--tone-health); }
    .tactile-card.outing { border-top: 4px solid var(--tone-outing); }

    .avatar-frame {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #05070B;
      border: 2px solid #293548;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.7);
    }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    .card-heading { font-size: 1.45rem; font-weight: 800; color: #FFFFFF; line-height: 1.2; letter-spacing: -0.2px; }
    .card-subtext { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; font-weight: 600; }

    .card-edit-dock {
      margin-top: 14px;
      width: 100%;
    }
    .btn-image-action {
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      border: 1px dashed #475569;
      background: #0B101D;
      color: #94A3B8;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-image-action.has-photo {
      background: #064E3B;
      border-color: #10B981;
      color: #A7F3D0;
      border-style: solid;
    }
  </style>
</head>
<body>

<div class="master-hud">
  <div class="brand-group">
    <div class="brand-title">🗣️ बाबा संवाद</div>
    <div class="brand-subtitle">Architectural Senior OS</div>
  </div>
  <div class="hud-actions">
    <button class="btn-architect" id="editTriggerBtn" onclick="toggleArchitectEdit()">🔒 संपादन</button>
    <button class="btn-sos-tactile" onclick="triggerTactileSOS()">🔔 मदत</button>
  </div>
</div>

<div class="acoustic-stage">
  <div>
    <div class="stage-text-lg" id="stageMainTitle">कोणत्याही कार्डवर टॅप करा</div>
    <div class="stage-text-sm" id="stageSubTitle">Baritone Natural Voice Engine Ready</div>
  </div>
  <button class="btn-replay" onclick="replayLastSpeech()">🔊 पुन्हा</button>
</div>

<div class="binary-container">
  <button class="binary-tile tile-yes" onclick="dispatchSpeech({id:'yes', mr:'हो, बरोबर आहे', sub:'Yes, correct', speak:'हो, बरोबर आहे', phonetic:'Hoo... Ho, barobar aahe. Yes.'})">✅ हो (YES)</button>
  <button class="binary-tile tile-no" onclick="dispatchSpeech({id:'no', mr:'नाही, मला नको', sub:'No, I do not want', speak:'नाही, मला नको', phonetic:'Naa-hee... Naahi, mala nako. No.'})">❌ नाही (NO)</button>
</div>

<div class="category-scroller" id="categoryChips"></div>
<div class="tactile-grid" id="cardContainerGrid"></div>

<input type="file" id="mediaUploadInput" accept="image/*" style="display:none" />

<script>
  const STORAGE_SLOT = 'baba_architect_sys_v5';
  let architectMode = false;
  let currentFilter = 'all';
  let activeTargetId = null;
  let lastDispatched = { mr:'हो, बरोबर आहे', phonetic:'Hoo... Ho, barobar aahe. Yes.', speak:'हो, बरोबर आहे' };

  const CATEGORY_LIST = [
    { id: 'all', label: '🌟 सर्व (All)' },
    { id: 'family', label: '👨‍👩‍👧‍👦 कुटुंब' },
    { id: 'daily', label: '💧 दैनंदिन' },
    { id: 'health', label: '💊 तब्येत' },
    { id: 'outing', label: '🚗 बाहेर / गावी' }
  ];

  const CARD_DATABASE = [
    { id: 'sushma', cat: 'family', icon: '👩', mr: 'सुषमा', sub: 'Sushma (Wife)', speak: 'सुषमा, इकडे ये', phonetic: 'Sushma... Sushma ikade ye' },
    { id: 'abhijeet', cat: 'family', icon: '👨', mr: 'अभिजीत', sub: 'Abhijeet (Son)', speak: 'अभिजीतला बोलवा', phonetic: 'Abhijeet... Abhijeet la bolva' },
    { id: 'sonali', cat: 'family', icon: '👩', mr: 'सोनाली (ताई)', sub: 'Sonali (Sister)', speak: 'सोनाली ताईला बोलवा', phonetic: 'Sonali... Sonali tai la bolva' },
    { id: 'ira', cat: 'family', icon: '👧', mr: 'इरा', sub: 'Ira (Granddaughter)', speak: 'इराला इकडे बोलवा', phonetic: 'Era... Era la ikade bolva' },
    { id: 'swapnali', cat: 'family', icon: '👩', mr: 'स्वप्नाली', sub: 'Swapnali (Daughter-in-law)', speak: 'स्वप्नाली, इकडे ये', phonetic: 'Swapnali... Swapnali ikade ye' },

    { id: 'water', cat: 'daily', icon: '💧', mr: 'पिण्याचे पाणी', sub: 'Drinking Water', speak: 'मला पिण्यासाठी पाणी द्या', phonetic: 'Paani... Mala pinyasathi paani dya' },
    { id: 'tablets', cat: 'daily', icon: '💊', mr: 'गोळ्या / औषधे', sub: 'Tablets / Medicine', speak: 'माझ्या गोळ्या आणि औषधे द्या', phonetic: 'Golya... Majhya golya aani aushadhe dya' },
    { id: 'food', cat: 'daily', icon: '🍛', mr: 'जेवण / भूक', sub: 'Food / Hungry', speak: 'मला भूक लागली आहे, जेवण द्या', phonetic: 'Jevan... Mala bhook lagli aahe, jevan dya' },
    { id: 'tea', cat: 'daily', icon: '☕', mr: 'गरम चहा', sub: 'Hot Tea', speak: 'मला गरम चहा हवा आहे', phonetic: 'Chaha... Mala garam chaha hava aahe' },
    { id: 'bathroom', cat: 'daily', icon: '🚻', mr: 'बाथरूम', sub: 'Washroom', speak: 'मला बाथरूमला जायचे आहे', phonetic: 'Bathroom... Mala bathroom la jayche aahe' },
    { id: 'glasses', cat: 'daily', icon: '👓', mr: 'माझा चष्मा', sub: 'My Glasses', speak: 'माझा चष्मा द्या', phonetic: 'Chashma... Majha chashma dya' },

    { id: 'toothache', cat: 'health', icon: '🦷', mr: 'दाढ दुखत आहे', sub: 'Toothache', speak: 'माझी दाढ खूप दुखत आहे', phonetic: 'Dadh dukhte... Majhi dadh khoop dukhat aahe' },
    { id: 'stomach', cat: 'health', icon: '🤢', mr: 'पोट बिघडले', sub: 'Stomach Upset', speak: 'माझे पोट बिघडले आहे', phonetic: 'Pot bighadle... Majhe pot bighadle aahe' },
    { id: 'doctor', cat: 'health', icon: '🩺', mr: 'डॉक्टरांकडे चला', sub: 'Visit Doctor', speak: 'मला डॉक्टरांकडे घेऊन चला', phonetic: 'Doctor... Mala doctoran kade gheun chala' },
    { id: 'bodypain', cat: 'health', icon: '🤕', mr: 'हात-पाय दुखणे', sub: 'Body Pain', speak: 'माझे हात पाय दुखत आहेत', phonetic: 'Haat paay dukhtat... Majhe haat paay dukhat aahet' },

    { id: 'walk', cat: 'outing', icon: '🚶‍♂️', mr: 'फिरायला जायचे', sub: 'Go for Walk', speak: 'मला बाहेर फिरायला जायचे आहे', phonetic: 'Firayla jaane... Mala baher firayla jayche aahe' },
    { id: 'village', cat: 'outing', icon: '🏡', mr: 'गावी जायचे', sub: 'Go to Village', speak: 'मला गावी जायचे आहे', phonetic: 'Gavi jaane... Mala gavi jayche aahe' }
  ];

  let systemState = { imageCache: {} };
  try {
    const rawData = localStorage.getItem(STORAGE_SLOT);
    if (rawData) systemState = JSON.parse(rawData);
  } catch (e) {}

  function saveSystemState() {
    try { localStorage.setItem(STORAGE_SLOT, JSON.stringify(systemState)); } catch (e) {}
  }

  function toggleArchitectEdit() {
    architectMode = !architectMode;
    const triggerBtn = document.getElementById('editTriggerBtn');
    triggerBtn.textContent = architectMode ? '🔓 संपादन: चालू' : '🔒 संपादन';
    triggerBtn.className = architectMode ? 'btn-architect active' : 'btn-architect';
    renderCardGrid();
  }

  // Elite Acoustically Tuned Baritone Engine
  async function dispatchSpeech(item) {
    lastDispatched = item;
    document.getElementById('stageMainTitle').textContent = item.mr;
    document.getElementById('stageSubTitle').textContent = item.phonetic;

    document.querySelectorAll('.tactile-card').forEach(el => el.classList.remove('is-active-speech'));
    const targetedTile = document.getElementById(`card-node-${item.id}`);
    if (targetedTile) targetedTile.classList.add('is-active-speech');

    // 1. Native Hardware TTS inside APK
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) {
      try {
        await window.Capacitor.Plugins.TextToSpeech.speak({
          text: item.speak,
          lang: 'mr-IN',
          rate: 0.74,
          pitch: 0.52, // Deep resonant acoustic baritone
          volume: 1.0
        });
        return;
      } catch (err) {
        try {
          await window.Capacitor.Plugins.TextToSpeech.speak({
            text: item.phonetic,
            lang: 'en-IN',
            rate: 0.74,
            pitch: 0.52,
            volume: 1.0
          });
          return;
        } catch (e2) {}
      }
    }

    // 2. Web Speech Synthesis with Baritone Shaping
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => {
        const availableVoices = window.speechSynthesis.getVoices() || [];
        const filteredVoices = availableVoices.filter(v => !/female|swara|heera|zira|samantha|veena|lekha|google hindi female/i.test(v.name));
        const eliteMaleVoice = filteredVoices.find(v => /mr|hi|en-IN/i.test(v.lang) && /male|rishi|prabhat|madhur|hemant|david|mark|guy|natural/i.test(v.name)) ||
                               filteredVoices.find(v => /male|rishi|prabhat|madhur|hemant|david|mark|guy/i.test(v.name)) ||
                               filteredVoices.find(v => /IN/i.test(v.lang)) || filteredVoices[0];

        const speechNode = new SpeechSynthesisUtterance(item.phonetic);
        window.__speechRef = speechNode;
        if (eliteMaleVoice) {
          speechNode.voice = eliteMaleVoice;
          speechNode.lang = eliteMaleVoice.lang;
        } else {
          speechNode.lang = 'en-IN';
        }
        speechNode.pitch = 0.52; // Deep baritone
        speechNode.rate = 0.74;  // Grounded human cadence
        speechNode.volume = 1.0;

        window.speechSynthesis.speak(speechNode);
      }, 25);
    }
  }

  function replayLastSpeech() { dispatchSpeech(lastDispatched); }

  function triggerTactileSOS() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const startTime = audioCtx.currentTime;
      [300, 450, 300, 450].forEach((hz, idx) => {
        const oscNode = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscNode.type = 'sine';
        oscNode.frequency.setValueAtTime(hz, startTime + idx * 0.16);
        gainNode.gain.setValueAtTime(0.35, startTime + idx * 0.16);
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + idx * 0.16 + 0.35);
        oscNode.connect(gainNode); gainNode.connect(audioCtx.destination);
        oscNode.start(startTime + idx * 0.16); oscNode.stop(startTime + idx * 0.16 + 0.38);
      });
    } catch (e) {}

    dispatchSpeech({
      id: 'sos',
      mr: 'कृपया इकडे या!',
      sub: 'Emergency Assistance',
      speak: 'कृपया इकडे या, मला मदत हवी आहे',
      phonetic: 'Krupaya ikade yaa... Mala madat havi aahe'
    });
  }

  function invokeImagePicker(event, id) {
    event.stopPropagation();
    activeTargetId = id;
    const fileElem = document.getElementById('mediaUploadInput');
    fileElem.value = '';
    fileElem.click();
  }

  document.getElementById('mediaUploadInput').addEventListener('change', function(evt) {
    const selectedFile = evt.target.files && evt.target.files[0];
    if (!selectedFile || !activeTargetId) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const imgObj = new Image();
      imgObj.onload = function() {
        const workCanvas = document.createElement('canvas');
        workCanvas.width = 200; workCanvas.height = 200;
        const sideLength = Math.min(imgObj.width, imgObj.height);
        workCanvas.getContext('2d').drawImage(imgObj, (imgObj.width - sideLength)/2, (imgObj.height - sideLength)/2, sideLength, sideLength, 0, 0, 200, 200);
        systemState.imageCache[activeTargetId] = workCanvas.toDataURL('image/jpeg', 0.85);
        saveSystemState();
        renderCardGrid();
      };
      imgObj.src = e.target.result;
    };
    reader.readAsDataURL(selectedFile);
  });

  function renderCategoryChips() {
    document.getElementById('categoryChips').innerHTML = CATEGORY_LIST.map(cat =>
      `<button class="category-chip ${currentFilter === cat.id ? 'active' : ''}" onclick="currentFilter='${cat.id}'; renderCategoryChips(); renderCardGrid();">${cat.label}</button>`
    ).join('');
  }

  function renderCardGrid() {
    const dataList = currentFilter === 'all' ? CARD_DATABASE : CARD_DATABASE.filter(c => c.cat === currentFilter);
    document.getElementById('cardContainerGrid').innerHTML = dataList.map(c => {
      const photoUrl = systemState.imageCache && systemState.imageCache[c.id];
      return `
        <div class="tactile-card ${c.cat}" id="card-node-${c.id}" onclick='dispatchSpeech(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
          <div class="avatar-frame">${photoUrl ? `<img src="${photoUrl}" />` : c.icon}</div>
          <div class="card-heading">${c.mr}</div>
          <div class="card-subtext">${c.sub}</div>
          ${architectMode ? `
            <div class="card-edit-dock">
              <button class="btn-image-action ${photoUrl ? 'has-photo' : ''}" onclick="invokeImagePicker(event, '${c.id}')">📷 फोटो बदल ${photoUrl ? '✓' : ''}</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  renderCategoryChips();
  renderCardGrid();
</script>
</body>
</html>
