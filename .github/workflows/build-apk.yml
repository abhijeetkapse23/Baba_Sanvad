name: Build Baba Sanvad Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor & Build Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor-community/text-to-speech@6.0.0
          printf '{"appId":"com.abhijeet.babasanvad","appName":"Baba Sanvad","webDir":"www"}\n' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Baba-Sanvad-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
